name = "visapath-worker"
main = "index.js"
compatibility_date = "2024-01-01"
account_id = "90b6bd4e010caa9a9c45a34f4cd178ff"

[vars]
ENVIRONMENT = "production"

[[kv_namespaces]]
binding = "VISAPATH_KV"
id = "3ba04cf600d34d5ca00bcf6a7361b766"

[[d1_databases]]
binding = "RULES_DB"
database_name = "visapath-rules-db"
database_id = "64730de6-403d-4ad6-9d32-7a3468401a39"

[[vectorize]]
binding = "VECTORIZE"
index_name = "visapath-rules"

[[r2_buckets]]
binding = "RAW_SOURCES"
bucket_name = "visapath-raw-sources"

# Document Readiness Checker — separate DB/bucket from RAG reference data since this is
# user PII with its own retention/access rules. IDs below are PLACEHOLDERS — run
# `wrangler d1 create visapath-app-db` and `wrangler r2 bucket create visapath-user-documents`
# (under the correct account — see deploy note) and fill in database_id before deploying.
[[d1_databases]]
binding = "APP_DB"
database_name = "visapath-app-db"
database_id = "0a1715ec-7a85-49a6-9b1d-1c81fca7e45b"

[[r2_buckets]]
binding = "USER_DOCUMENTS"
bucket_name = "visapath-user-documents"

[triggers]
crons = ["0 3 * * 1", "0 4 * * *"]

# Set secrets via:
# wrangler secret put OPENROUTER_API_KEY
# wrangler secret put PAYPAL_CLIENT_ID
# wrangler secret put PAYPAL_SECRET
